      LOCONAV_WEBHOOK_SECRETS: ""
      LOCONAV_WEBHOOK_AUTO_CREATE_DEVICE: "false"
      LOCONAV_WEBHOOK_ALLOW_INSECURE: "false"

  - name: iot-broker-config
    image: { repository: iad.ocir.io/hbssoc/iot-broker-config-service, tag: stg }
    port: 3002
    useCommonEnv: false
    # NOT in the real nginx.conf -- internal-only, no Ingress. See README.md.
    env:
