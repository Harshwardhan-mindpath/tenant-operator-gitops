      BASE_URL: /tranops
      VITE_API_URL: "https://prototype-bridgestg.qraie.ai/tranops/api"
      VITE_WS_URL: "https://prototype-bridgestg.qraie.ai/"

  - name: tranops-backend
    image: { repository: iad.ocir.io/hbssoc/tranops-backend, tag: prototype }
    port: 30196
    # NOT in the real nginx.conf -- internal-only, no Ingress. See README.md.
    env:
      SLM_API_URL: https://slm-kb.qraie.ai
      SLM_USERNAME: bridgeUser
      # NOTE: plaintext in the source compose file, same recommendation as
      # controlops-server's DB_PASSWORD above.
      SLM_PASSWORD: "bridgeUser@123"
      MONGODB_URI: "mongodb://mongo:mongo@192.168.85.194:27092/tranops?authSource=admin"
      JWT_SECRET: "9f3c6d8a4e1b7f2d9c5a8e6b4d1f0a7c3e9b2f8d6a4c1e5b7d0f9a2c8e6"
      JWT_EXPIRES_IN: 24h
      API_PORT: "30196"
      ELEVENLABS_API_KEY: "sk_***"
      ELEVENLABS_API_URL: https://api.elevenlabs.io
      AGENTS_API_URL: "https://prototype-bridgestg.qraie.ai"
      POLLING_INTERVAL_MS: "30000"
      MCP_SERVER_URL: https://mcp-slm-client.qryde.net/get_conversations

  # --- IoT broker ---
  - name: iot-broker-data
    image: { repository: iad.ocir.io/hbssoc/iot-broker-data-service, tag: stg }
    port: 3001
    useCommonEnv: false
    # NOT in the real nginx.conf -- internal-only, no Ingress. See README.md.
    env:
      NODE_ENV: production
      PORT: "3001"
      MONGODB_URI: "mongodb://mongo:mongo@192.168.85.194:27092/"
      IOT_VLM_BASE_URL: "https://prototype-bridgestg.qraie.ai/enrollment"
      BROKER_SERVICE_URL: "http://iot-broker-broker:3003"
      # Were `${VAR:-default}` compose substitutions -- now plain values,
      # fill in real ones per tenant.
