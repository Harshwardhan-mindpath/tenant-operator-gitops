      CONF_URL: "https://qraie_ai-b.qryde.net/config/dbconnstr"
      TZ: America/New_York

  # --- Tranops ---
  - name: tranops-ui
    image: { repository: iad.ocir.io/hbssoc/tranops-ui, tag: prototype }
    port: 30194
    # NOT in the real nginx.conf -- internal-only, no Ingress. See README.md.
