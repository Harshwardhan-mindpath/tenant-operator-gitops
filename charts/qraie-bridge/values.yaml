        mountPath: /root/.deepface
      - name: enrollmentDb
        mountPath: /app/db
    healthCheck:
      path: /
      port: 3003

  # --- ACL / Prism / Voxflow / Scheduler / Radicale ---
  - name: acl-server
    image: { repository: iad.ocir.io/hbssoc/acl-server, tag: stg }
    port: 28077
    # Per nginx.conf: `location /acl_server/api { proxy_pass
    # http://prototype_acl_server/api; }` -- no trailing slash on the
    # location, and the proxy_pass URI is "/api" -- the matched prefix
    # ("/acl_server/api") is replaced with "/api", not stripped to "/".
    ingress:
      enabled: true
      path: /acl_server/api
      rewriteTarget: "/api"
    env:
      PORT: "28077"

  - name: prism-ui
    image: { repository: iad.ocir.io/hbssoc/prism-ui, tag: stg }
    port: 28080
    # Per nginx.conf: `location /prism-ui { proxy_pass
    # http://prototype_prism_ui/; }` -- no trailing slash on the location,
    # bare "/" proxy_pass URI -- matched prefix replaced with "/".
    ingress:
      enabled: true
      path: /prism-ui
      rewriteTarget: "/"
    env:
      PORT: "28080"
      VITE_API_URL: "https://prototype-bridgestg.qraie.ai/prism/api"

  - name: prism-backend
    image: { repository: iad.ocir.io/hbssoc/prism-backend, tag: stg }
    port: 28078
    # Per nginx.conf: `location /prism/api { proxy_pass
    # http://prototype_prism_backend/; }` -- same "strip prefix, replace
    # with /" pattern as prism-ui above.
    ingress:
      enabled: true
      path: /prism/api
      rewriteTarget: "/"
    vault:
      enabled: true
    env:
      PORT: "28078"
      VIDEOS_DIR: /data/prism-videos
    persistentVolumeMounts:
      - name: prismVideos
        mountPath: /data/prism-videos

  - name: prism-scanner
    image: { repository: iad.ocir.io/hbssoc/prism-scanner, tag: stg }
    port: 28079
    # Per nginx.conf: `location /prism-scanner { proxy_pass
    # http://prototype_prism_scanner/; }` -- same pattern again.
    ingress:
      enabled: true
      path: /prism-scanner
