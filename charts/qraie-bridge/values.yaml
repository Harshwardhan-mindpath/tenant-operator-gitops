# Converted from prototype-bridge's docker-compose.yml. One logical service
# per compose entry -- "_blue"/"_green" pairs were collapsed to a single
# Deployment each (per-service `image.tag` is now just a value to change;
# Kubernetes rolling updates replace the manual blue/green swap). See this
# chart's README.md for the full list of TODOs/conflicts this conversion
# surfaced that need your review before a real rollout.

global:
  # Was `tenant.id`/`TENANT_ID` throughout the compose file.
  tenantId: PROTOTYPE
  # Was VIRTUAL_HOST -- becomes the host on every one of this chart's
  # Ingress objects (one per externally-exposed service, see the "Ingress
  # routing" section of README.md for why it's one-per-service instead of
  # one shared Ingress).
  domain: prototype-bridgestg.qraie.ai
  ingressClassName: nginx
  ingressAnnotations: {}
  imagePullSecrets: []

  # TLS termination. The source nginx.conf terminated TLS itself from a
  # cert file on disk (/etc/nginx/certs/qraie.ai.crt) with a hand-rolled
  # Let's Encrypt ACME-challenge location for renewal -- the Kubernetes
  # equivalent is a TLS Secret (created by cert-manager, or manually) that
  # ingress-nginx terminates against; cert-manager owns the ACME challenge
  # routing itself, nothing to replicate here. Leave `enabled: false` to
  # serve plain HTTP (e.g. behind an external TLS-terminating LB instead).
  tls:
    enabled: false
    secretName: ""

  # Reproduces the source nginx.conf's `add_header` lines exactly (see
  # README.md). Applied identically to every exposed service's Ingress via
  # a configuration-snippet annotation.
  securityHeaders: true

  # Was the `x-common-env-variables` YAML anchor, merged into every service
  # that had `<<: *common-env-variables` in its `environment:` block --
  # same merge behavior here: a service's own `env` overrides these on key
  # conflicts. Services that did NOT use the anchor set `useCommonEnv: false`.
  commonEnv:
    REDIS_HOST: "192.168.85.91"
    REDIS_PORT: "30168"
    REDIS_PASSWORD: "Hbs52o2oR-STG"
    GLOBALAPIBASEURL: "http://192.168.85.194:1038"
    ACTIVE_COLOR: ""
    START_PORT: "30166"

  # Vault Agent Injector -- same mechanism already wired for the tenant
  # nginx chart (poc/chart-workplace) and the tenant-operator itself. Only
  # services below that had `/vault/secrets:/vault/secrets:ro` in the
  # compose file set `vault.enabled: true` on themselves; this just holds
  # the shared role name.
  vault:
    role: tenant-workload

  # Applied to every Deployment unless a service overrides `resources:`.
  defaultResources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

# --- Persistent volumes -----------------------------------------------------
# Named PVCs referenced by services below via `persistentVolumeMounts`.
# Sizes are starting points -- tune per tenant. Anything that was a host
# bind-mount of *static, pre-populated* content in the compose file (config
# files, not writable data dirs) can't be turned into a PVC by this chart --
# see `radicale.configConfigMapName`/`rightsConfigMapName` below and the
# README's TODO list for the ones this applies to.
persistence:
  bridgeCpSrInstances: { size: 1Gi }   # was the `bridge-cp-wtl-sr-instances` named volume
  bridgeCpRedisData: { size: 1Gi }     # was the `redis-data` named volume
  voxflowAgents: { size: 256Mi }        # was the `voxflow_agents` named volume
  voxflowMcp: { size: 256Mi }           # was the `voxflow_mcp` named volume
  erepGenerated: { size: 1Gi }          # was erep-server's ./generated-ereps bind mount
  erepLogs: { size: 512Mi }             # was erep-server's ./logs bind mount
  gatewayAttachments: { size: 1Gi }     # was the shared ./attachments/./attachment/./uploads bind mounts
  prismVideos: { size: 5Gi }            # was prism-backend's /data/prism-videos bind mount
  radicaleData: { size: 512Mi }         # was radicale's ./radicale/data bind mount
  enrollmentDeepface: { size: 2Gi }     # was enrollment-api's /hbss/iot-vlm/deepface bind mount
  enrollmentDb: { size: 1Gi }           # was enrollment-api's /hbss/iot-vlm/db bind mount

# Radicale's config/rights are static files the *compose host* had checked
# out at ./radicale/config and ./radicale/rights -- this chart has no way to
# know their contents. Create them yourself and point at them here, e.g.:
#   kubectl create configmap radicale-config --from-file=./radicale/config -n <tenant-ns>
#   kubectl create configmap radicale-rights --from-file=./radicale/rights -n <tenant-ns>
radicale:
  configConfigMapName: ""
  rightsConfigMapName: ""

# --- Services ----------------------------------------------------------------
# One entry per logical service. See README.md for the full schema and for
# every TODO/ambiguity this conversion surfaced (the /var/run/docker.sock
# mounts that were deliberately dropped, the dangling PRISM_BASE_URL
# reference to a service that doesn't exist in the compose file, and the
# three services that all implicitly claimed the Ingress's "/" path).
services:
  # --- Redis instances ---
  - name: qraie-redis-blue
    image: { repository: redis, tag: "7" }
    command: ["redis-server", "--requirepass", "Hbs52o2oR-STG"]
    port: 6379
    useCommonEnv: false

  - name: qraie-redis
    image: { repository: redislabs/redisgears, tag: "1.2.5" }
    port: 6379
    useCommonEnv: false
    dnsConfig:
      nameservers: ["8.8.8.8", "8.8.4.4"]

  - name: bridge-cp-redis
    image: { repository: iad.ocir.io/hbssoc/bridge-cp-redis, tag: stg }
    port: 6379
    useCommonEnv: false
    dnsConfig:
      nameservers: ["8.8.8.8", "8.8.4.4"]
    persistentVolumeMounts:
      - name: bridgeCpSrInstances
        mountPath: /opt/bridge-cp-wtl/sr-instances
      - name: bridgeCpRedisData
        mountPath: /data
    # TODO: compose also bind-mounted the host path
    # /opt/bridge-cp-redis/dispatcher here -- static content that lived on
    # the docker-compose VM, no portable Kubernetes equivalent. Bring your
    # own ConfigMap/PVC and add it via extraVolumes/extraVolumeMounts below
    # if this service actually needs it at runtime.
    extraVolumes: []
    extraVolumeMounts: []

  # --- Bridge control plane ---
  - name: bridge-cp-conductor
    image: { repository: iad.ocir.io/hbssoc/bridge-cp-conductor, tag: prototype }
    port: 8461
    useCommonEnv: false
    # Per nginx.conf: `location /controlopsv2/api/ { proxy_pass http://prototype_controlops_v2/; }`
    # -- trailing slash on both sides strips the matched prefix entirely.
    ingress:
      enabled: true
      path: /controlopsv2/api/
      rewriteTarget: "/"
    vault:
      enabled: true
    env:
      API_PORT: "8461"
      REDIS_HOST: bridge-cp-redis   # was the container name, now the Service name
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "Hbs52o2oR-STG"
      REDIS_CONTAINER: bridge-cp-redis
      REDIS_DISPATCHER_PATH: /opt/bridge-cp-redis/dispatcher/master_dispatcher.py
      SR_BASE_PATH: /opt/bridge-cp-wtl/sr-instances
      SR_NAME: bridge-cp-PROTOTYPE-sr
      GEMINI_MODEL: gemini-3-flash-preview
      WORKPLACE_DM_SOCKET_URL: "https://prototype-bridgestg.qraie.ai"
      WORKPLACE_DM_CLIENT_ID: QraieBot
      WORKPLACE_DM_PASSWORD: '$2b$10$CYXVMyolsdZFu/XjgwuhS.5zCNk3WW64j5AJVy8sKs0.bIKEEKctm'
      NOTIF_ENG_BASE_URL: https://staging-notif-eng.qryde.net
    persistentVolumeMounts:
      - name: bridgeCpSrInstances
        mountPath: /opt/bridge-cp-wtl/sr-instances
    # TODO: compose also mounted /var/run/docker.sock here (this container
    # spun up sibling Docker containers directly) and the same
    # /opt/bridge-cp-redis/dispatcher host path as bridge-cp-redis above.
    # Deliberately NOT carried over -- see README.md "Docker socket" section.
    # Whatever this used docker.sock for needs a real redesign (Kubernetes
    # Jobs API + scoped RBAC instead of mounting the host's Docker socket,
    # which is equivalent to granting root on the node).
    extraVolumes: []
    extraVolumeMounts: []

  - name: bridge
    image: { repository: iad.ocir.io/hbssoc/acetaxi-bridge, tag: prototype }
    port: 30170
    # Confirmed by the real nginx.conf's `location / { proxy_pass
    # http://prototype_bridge; }` -- no URI in proxy_pass means the request
    # is forwarded completely unrewritten. This resolves what was previously
    # an unverifiable guess: the compose file's VIRTUAL_PATH/VIRTUAL_HOST env
    # vars alone made `bridge`, `iot-broker-web`, and `radicale` all look
    # like they wanted "/" -- nginx.conf shows only `bridge` is actually
    # wired to it; the other two were never in the real routing at all (see
    # README.md "Ingress routing").
    ingress:
      enabled: true
      path: /
      rewriteTarget: ""   # no rewrite -- full original path passed through
    vault:
      enabled: true
    env:
      PORT: "30170"
      NODE_ENV: production
      GEMINI_MODEL: gemini-3.1-pro-preview

  # --- Control ops ---
  - name: controlops-server
    image: { repository: iad.ocir.io/hbssoc/controlops_server, tag: prototype }
    port: 30172
    useCommonEnv: false
    # NOT in the real nginx.conf (only VIRTUAL_PATH env vars suggested this
    # was externally routed) -- internal-only, no Ingress. See README.md.
    env:
      REDIS_HOST: qraie-redis   # was container name "qraie-redis-prototype"
      REDIS_PORT: "6379"
      GLOBALAPIBASEURL: https://qraie_ai-b.qryde.net
      API_PORT: "30172"
      DB_HOST: "192.168.85.91"
      DB_USER: sa
      # NOTE: plaintext in the source compose file -- move to `vault:
      # enabled: true` (Vault Agent) or an existingSecretName-style
      # mechanism before any real deployment. Kept as-is here for parity.
      DB_PASSWORD: nighT0w1
      DB_NAME: prototype
      MONGODB_URI: "mongodb://mongo:mongo@192.168.85.194:27092/finalproj?authSource=admin"

  # --- Erep server ---
  - name: erep-server
    image: { repository: iad.ocir.io/hbssoc/erep-server, tag: stg }
    port: 30174
    # NOT in the real nginx.conf -- internal-only, no Ingress. See README.md.
    env:
      NODE_ENV: production
      BASE_URL: https://qraie_ai-b.qryde.net
      MONGODB_URI: ""   # blank in the source compose file too
      GLOBALAPIBASEURL: https://qraie_ai-b.qryde.net
      # DOCKER_ENABLED signaled this service's own /var/run/docker.sock use
      # in the source -- kept for parity/documentation, but see the TODO
      # below: the socket mount itself was deliberately dropped.
      DOCKER_ENABLED: "true"
      LOG_LEVEL: info
    persistentVolumeMounts:
      - name: erepGenerated
        mountPath: /app/generated-ereps
      - name: erepLogs
        mountPath: /app/logs
    # TODO: compose also mounted /var/run/docker.sock here -- deliberately
    # NOT carried over, same reasoning as bridge-cp-conductor above.

  # --- Qraie API gateway + microservice ---
  - name: qraie-api-gateway
    image: { repository: iad.ocir.io/hbssoc/qraie-api-gateway-v4-stg, tag: prototype }
    port: 30176
    # NOT in the real nginx.conf -- internal-only, no Ingress. See README.md.
    env:
    # was three separate bind mounts (./attachments/, ./attachment/,
    # ./Jira_Revamp_MicroSevice/uploads/) -- consolidated onto one shared
    # PVC via subPaths since none of them held pre-populated content.
    persistentVolumeMounts:
      - name: gatewayAttachments
        mountPath: /src/attachment
        subPath: attachments
      - name: gatewayAttachments
        mountPath: /src/app/attachment
        subPath: attachment
      - name: gatewayAttachments
        mountPath: /src/app/uploads
        subPath: uploads

  - name: microservice-qraie
    image: { repository: iad.ocir.io/hbssoc/qraiebot-microservice-v4-stg, tag: prototype }
    # No VIRTUAL_HOST in the source -- internal only, reached by
    # qraie-api-gateway/others via the Service name.
    port: 0
    env:
    persistentVolumeMounts:
      - name: gatewayAttachments
        mountPath: /src/attachment
        subPath: attachments
      - name: gatewayAttachments
        mountPath: /src/app/uploads
        subPath: uploads

  # --- Qraie UI / admin panel ---
  - name: qraie-ui
    image: { repository: iad.ocir.io/hbssoc/qraie-ui-hbss-v4-stg, tag: prototype }
    port: 30180
    # NOT in the real nginx.conf -- internal-only, no Ingress. See README.md.

  - name: admin-panel
    image: { repository: iad.ocir.io/hbssoc/qraie-admin-panel, tag: bridge }
    port: 30182
    # NOT in the real nginx.conf -- internal-only, no Ingress. See README.md.
    env:
      NODE_ENV: development
      NEXT_PUBLIC_VERSION: "1.0.1"

  # --- WFM ---
  - name: wfm-api-gateway
    image: { repository: iad.ocir.io/hbssoc/fabreq_gateway, tag: prototype }
    port: 30184
    # Per nginx.conf: `location /organization/wfm/api/ { proxy_pass
    # http://prototype_wfm_api_gateway/; }` -- trailing slash both sides,
    # strips the matched prefix entirely.
    ingress:
      enabled: true
      path: /organization/wfm/api/
      rewriteTarget: "/"
    env:
      SERVER_PORT: "30184"
      SERVER_HOST: "0.0.0.0"
      NODE_ENV: development
      SERVER_NAME: wfm-gateway
      FABREQ_COMMAND_ENDPOINT_MAP: "http://wfm-microservice:9001"
      ALLOWED_ORIGINS: "*"
      LOG_LEVEL: debug
      TZ: America/New_York

  - name: wfm-ui
    image: { repository: iad.ocir.io/hbssoc/wfm-ui, tag: prototype }
    port: 30188
    # NOT in the real nginx.conf -- internal-only, no Ingress. See README.md.
    env:
      SERVER_HOST: "0.0.0.0"
      NODE_ENV: development
      NEXT_PUBLIC_SOCKET_URL: "https://prototype-bridgestg.qraie.ai/organization/wfm/api/"
      NEXT_PUBLIC_VERSION: "1.0.1"
      TZ: America/New_York

  - name: wfm-microservice
    image: { repository: iad.ocir.io/hbssoc/fabreq-microservice, tag: prototype }
    port: 9001   # no ingress -- reached only via wfm-api-gateway's FABREQ_COMMAND_ENDPOINT_MAP (Service DNS)
    env:
      SERVER_PORT: "9001"
      SERVER_HOST: "0.0.0.0"
      NODE_ENV: development
      MICROSERVICE_NAME: wfm-microservice
      TENANT_KEY: wfm
      TENANT_IDS: prototype
      CONFIG_API_URL: "https://qraie_ai-b.qryde.net/config/dbconnstr"
      JWT_SECRETS_MAP: '{ "wfm": "MmdBz4qgZzqhoZxBn8gyN3ErO9kFthCl" }'
      GLOBAL_CONN_POOL_CONFIG: '{"enableStatistics": true, "queueTimeout": 240000, "poolIncrement": 2}'
      TZ: America/New_York

  # --- MCP ---
  - name: mcp-server
    image: { repository: iad.ocir.io/hbssoc/mcp_server, tag: prototype }
    port: 10011   # no ingress -- reached only via mcp-client's MCP_SERVER_URL (Service DNS)
    env:
      PORT: "10011"
      MCP_SERVER_PORT: "10011"
      TZ: America/New_York
    healthCheck:
      path: /health
