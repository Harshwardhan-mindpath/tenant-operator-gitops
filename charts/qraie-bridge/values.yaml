  - name: mcp-client
    image: { repository: iad.ocir.io/hbssoc/mcp_client, tag: prototype }
    port: 30192
    # Per nginx.conf: `location /galaxy/slmapi/ { proxy_pass
    # http://prototype_mcp_client/; }` -- trailing slash both sides, strips
