      PORT: "3003"
      LOG_LEVEL: debug
      DATA_SERVICE_URL: "http://iot-broker-data:3001"
      CONFIG_SERVICE_URL: "http://iot-broker-config:3002"
      WEB_PORTAL_URL: "http://iot-broker-web:80"
      SOCKET_IO_PATH: /socket.io
      FRONTEND_URL: "*"

  - name: iot-broker-admin
    image: { repository: iad.ocir.io/hbssoc/iot-broker-admin-panel, tag: stg }
    port: 80
    useCommonEnv: false
    # NOT in the real nginx.conf -- internal-only, no Ingress. See README.md.
    env:
      FRONTEND_URL: "https://prototype-bridgestg.qraie.ai"
      BASE_URL: "https://prototype-bridgestg.qraie.ai"
      PUBLIC_URL: "https://prototype-bridgestg.qraie.ai"

  - name: iot-broker-web
    image: { repository: iad.ocir.io/hbssoc/iot-broker-web-portal, tag: stg }
    port: 80
    useCommonEnv: false
    # NOT in the real nginx.conf -- confirmed by nginx.conf's upstream list,
