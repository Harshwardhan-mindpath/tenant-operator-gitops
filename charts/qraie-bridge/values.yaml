      PORT: "3002"
      MONGODB_URI: "mongodb://mongo:mongo@192.168.85.194:27092/"

  - name: iot-broker-broker
    image: { repository: iad.ocir.io/hbssoc/iot-broker-broker-service, tag: stg }
    port: 3003
    useCommonEnv: false
    # NOT in the real nginx.conf -- internal-only, no Ingress. See README.md.
    env:
