apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.tenant.id }}
  namespace: {{ .Values.tenant.namespace }}
  labels:
    app.kubernetes.io/instance: {{ .Values.tenant.id }}
    app.kubernetes.io/name: workplace
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Values.tenant.id }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Values.tenant.id }}
        app.kubernetes.io/name: workplace
    spec:
      containers:
        - name: workplace
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 80
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 3
